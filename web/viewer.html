<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>android-kit UI 查看器</title>
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem('ak_theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') {
    t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
:root{--bg:#0e0e0f;--panel:#151516;--line:#282829;--text:#ececec;--muted:#8f8f92;
  --accent:#7c9cff;--green:#4ade80;--danger:#f87171;--warn:#fbbf24;
  --top:#17171a;--input-bg:#141415;--input-bd:#343436;--btn:#1e1e20;--btn-hi:#3a3a3c;
  --splitter-drag:#232325;--stage-bg:#101012;--checker:#17171a;
  --label-bg:rgba(26,26,28,.95);--label-bd:#3a3a3c;--label-text:#dbe4ff;--label-id:#9bc0ff;--label-name:#d6d6d9;
  --tip-bg:rgba(26,26,28,.97);
  --raw-bg:#121213;--raw-bd:#262628;--chip-bg:#202022;--chip-bd:#2c2c2e;--chip-text:#a8a8ac;
  --box:#6ea8ff88;--box-window:#6ea8ff2e;--box-bg:rgba(110,168,255,.07);--box-hi:#9bc0ff;--box-hi-bg:rgba(110,168,255,.13);
  --shadow:rgba(0,0,0,.63);--shadow-soft:rgba(0,0,0,.44);--shadow-strong:rgba(0,0,0,.69)}
:root[data-theme="light"]{--bg:#ffffff;--panel:#f7f7f9;--line:#e4e4e8;--text:#1b1b1e;--muted:#6b6c72;
  --accent:#3b5bdb;--green:#16a34a;--danger:#dc2626;--warn:#d08700;
  --top:#f4f4f6;--input-bg:#ffffff;--input-bd:#d9d9de;--btn:#f2f2f4;--btn-hi:#c9c9d0;
  --splitter-drag:#e2e2e7;--stage-bg:#f0f0f3;--checker:#e9e9ee;
  --label-bg:rgba(255,255,255,.96);--label-bd:#d6d6db;--label-text:#26304a;--label-id:#3b5bdb;--label-name:#4b4c52;
  --tip-bg:rgba(255,255,255,.98);
  --raw-bg:#f5f5f7;--raw-bd:#e4e4e8;--chip-bg:#ededf0;--chip-bd:#dcdce1;--chip-text:#5c5d63;
  --box:#4c6ef588;--box-window:#4c6ef52e;--box-bg:rgba(76,110,245,.07);--box-hi:#3b5bdb;--box-hi-bg:rgba(76,110,245,.13);
  --shadow:rgba(0,0,0,.16);--shadow-soft:rgba(0,0,0,.10);--shadow-strong:rgba(0,0,0,.20)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC",sans-serif;
  display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);
  background:var(--top);flex-wrap:wrap}
.top h1{font-size:14px;margin:0;font-weight:650}
.top .meta{color:var(--muted);font-size:11.5px}
.searchwrap{display:flex;align-items:center;gap:8px;background:var(--input-bg);border:1px solid var(--input-bd);
  border-radius:10px;padding:4px 10px;box-shadow:0 0 0 3px #4d6bd81f}
.searchwrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px #4d6bd840}
.searchwrap .ico{font-size:14px;opacity:.85}
.searchwrap label{font-size:11px;color:var(--muted);white-space:nowrap}
input[type=search]{background:transparent;border:0;border-radius:8px;padding:6px 2px;min-width:300px;outline:none}
.hiddenbar{display:none;align-items:center;gap:8px;font-size:11.5px;color:var(--warn)}
.hiddenbar.on{display:flex}
.btn{border:1px solid var(--line);background:var(--btn);padding:6px 10px;border-radius:8px;cursor:pointer;font-size:12px}
.btn:hover{border-color:var(--btn-hi)}
.spacer{flex:1}
.workspace{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 6px 360px;min-height:0}
.splitter{cursor:col-resize;background:var(--top);border-left:1px solid var(--line);border-right:1px solid var(--line);
  position:relative;touch-action:none}
.splitter::after{content:"";position:absolute;left:2px;top:50%;transform:translateY(-50%);width:2px;height:36px;
  border-radius:2px;background:var(--btn-hi)}
.splitter:hover,.splitter.drag{background:var(--splitter-drag)}
.splitter:hover::after,.splitter.drag::after{background:var(--accent)}
.stageWrap{position:relative;overflow:hidden;display:flex;min-width:0;min-height:0}
.stage{flex:1;min-width:0;position:relative;overflow:auto;background:
  linear-gradient(45deg,var(--checker) 25%,transparent 25%),linear-gradient(-45deg,var(--checker) 25%,transparent 25%),
  linear-gradient(45deg,transparent 75%,var(--checker) 75%),linear-gradient(-45deg,transparent 75%,var(--checker) 75%) var(--stage-bg);
  background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0;
  padding:24px;display:flex;gap:24px;align-items:flex-start}
.canvas-hold{position:relative;flex:0 0 auto}
.canvas-wrap{position:absolute;top:0;left:0;transform-origin:0 0;filter:drop-shadow(0 12px 30px var(--shadow))}
.canvas-wrap img{display:block;max-width:none;image-rendering:auto}
.overlay{position:absolute;top:0;left:0;pointer-events:none}
.box{position:absolute;border:1px solid var(--box);background:var(--box-bg);cursor:pointer;pointer-events:auto}
.box:hover{border-color:var(--box-hi);background:var(--box-hi-bg)}
.box.window{pointer-events:none;border-color:var(--box-window);background:transparent}
.box.match{border:2px solid var(--danger);background:#f8717144;box-shadow:0 0 0 1px #f8717188 inset;z-index:20}
.box.selected{border:2px solid var(--green);background:#4ade8044;box-shadow:0 0 0 2px #4ade8088 inset,0 0 12px #4ade80aa;z-index:30}
.box.match.selected{border-color:var(--warn);background:#fbbf2433}
.label{position:absolute;left:0;bottom:100%;margin-bottom:5px;background:var(--label-bg);border:1px solid var(--label-bd);
  border-radius:7px;color:var(--label-text);font-size:10.5px;line-height:1.45;padding:4px 7px;white-space:normal;
  display:none;max-width:280px;pointer-events:none;z-index:60;box-shadow:0 8px 20px var(--shadow-soft)}
.label span{display:block;word-break:break-all}
.label .lbl-id{color:var(--label-id);font-family:ui-monospace,Menlo,monospace}
.label .lbl-name{color:var(--label-name)}
.label::after{content:"";position:absolute;left:9px;top:100%;border:5px solid transparent;border-top-color:var(--label-bd)}
.box.selected .label,.box.match .label{display:block}
/* 悬停气泡：固定尺寸，不随缩放变小 */
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--tip-bg);border:1px solid var(--label-bd);border-radius:7px;
  padding:5px 8px;font-size:11.5px;line-height:1.45;color:var(--label-text);max-width:340px;box-shadow:0 10px 24px var(--shadow-strong)}
.tip[hidden]{display:none}
.tip b{display:block;font-weight:600;color:var(--label-id);font-family:ui-monospace,Menlo,monospace;word-break:break-all}
.tip span{display:block;color:var(--label-name);word-break:break-all}
.zoombar{position:absolute;left:14px;top:14px;background:var(--top);border:1px solid var(--line);
  border-radius:8px;padding:6px 8px;display:flex;align-items:center;gap:6px;font-size:11.5px;z-index:20;
  box-shadow:0 6px 22px var(--shadow-soft)}
.zoombar button{min-width:26px;height:26px;padding:0 7px;white-space:nowrap;
  border:1px solid var(--line);background:var(--btn);border-radius:6px;cursor:pointer}
#zoom-label{min-width:34px;text-align:center}
.side{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.side .head{padding:10px 14px;border-bottom:1px solid var(--line);font-weight:650;font-size:12.5px}
.side .head .act{display:block;margin-top:3px;font-weight:500;font-size:11px;color:var(--label-id);
  font-family:ui-monospace,Menlo,monospace;word-break:break-all;user-select:text}
.side .body{padding:12px 14px;overflow:auto;flex:1}
.section{margin-bottom:16px}
.section h3{margin:0 0 8px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.kv{display:grid;grid-template-columns:90px 1fr;gap:4px 10px;font-size:12px}
.kv .k{color:var(--muted)}
.kv .v{word-break:break-all;font-family:ui-monospace,Menlo,monospace;font-size:11.5px}
.raw{background:var(--raw-bg);border:1px solid var(--raw-bd);border-radius:8px;padding:9px;font-size:11px;
  white-space:pre-wrap;word-break:break-all;max-height:320px;overflow:auto;color:var(--label-name)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:10.5px;padding:2px 7px;border-radius:999px;background:var(--chip-bg);border:1px solid var(--chip-bd);color:var(--chip-text)}
.empty{color:var(--muted);padding:30px 14px;text-align:center}
.status{font-size:11.5px;color:var(--muted)}
.status.err{color:var(--danger)}
.toast{position:fixed;right:18px;bottom:18px;background:var(--chip-bg);border:1px solid var(--input-bd);padding:9px 13px;
  border-radius:8px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:50;font-size:12px}
.toast.show{opacity:1;transform:none}
</style>
</head>
<body>
<div class="top">
  <h1>UI 查看器</h1>
  <div class="searchwrap">
    <span class="ico">⌕</span>
    <label for="search">搜索元素</label>
    <input type="search" id="search" placeholder="id / text / content-desc / class" oninput="applyFilter()">
  </div>
  <span class="status" id="match-status"></span>
  <span class="hiddenbar" id="hiddenbar">
    已隐藏 <b id="hidden-count">0</b> 个元素
    <button class="btn" onclick="restoreHidden()">恢复全部</button>
  </span>
  <div class="spacer"></div>
  <label class="status"><input type="checkbox" id="show-all" checked onchange="renderBoxes()"> 显示全部线框</label>
  <button class="btn" onclick="copyBounds()">复制选中 bounds</button>
  <a class="btn" id="shot-link" target="_blank" rel="noopener">原图</a>
  <button class="btn" id="theme-btn" onclick="toggleTheme()" title="切换黑白主题">🌙</button>
</div>
<div class="workspace">
  <div class="stageWrap">
    <div class="stage" id="stage">
      <div class="canvas-hold" id="canvas-hold">
        <div class="canvas-wrap" id="canvas-wrap">
          <img id="shot" alt="截图">
          <div class="overlay" id="overlay"></div>
        </div>
      </div>
      <div class="tip" id="tip" hidden></div>
    </div>
    <div class="zoombar">
      <button onclick="setZoom(zoom-0.1)">−</button>
      <span id="zoom-label">100%</span>
      <button onclick="setZoom(zoom+0.1)">+</button>
      <button onclick="setZoom(1)">1:1</button>
      <button onclick="fitZoom()">适应</button>
    </div>
  </div>
  <div class="splitter" id="splitter" title="拖动调整宽度"></div>
  <aside class="side" id="side">
    <div class="head">元素信息<span class="act" id="head-act" hidden></span></div>
    <div class="body" id="info"><div class="empty">点击左侧线框或截图上的元素</div></div>
  </aside>
</div>
<div class="toast" id="toast"></div>

<script>
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  const b = document.getElementById('theme-btn');
  if (b) b.textContent = t === 'light' ? '☀️' : '🌙';
}
function toggleTheme() {
  const t = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  try { localStorage.setItem('ak_theme', t); } catch (e) {}
  applyTheme(t);
}
applyTheme(document.documentElement.getAttribute('data-theme') || 'dark');

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const QS = new URLSearchParams(location.search);
const TOKEN = QS.get('token') || sessionStorage.getItem('ak_token') || '';
if (TOKEN) sessionStorage.setItem('ak_token', TOKEN);
const UI_PATH = QS.get('ui') || '';
const SHOT_PATH = QS.get('shot') || '';
const PROJECT_ID = QS.get('project') || '';

let TREE = [];
let NODES = [];
let DISPLAY = {dpi:160, scale:1, width:0, height:0, source:'默认'};
let NATIVE_W = 0;
let NATIVE_H = 0;
let TREE_W = 0;
let TREE_H = 0;
let COORD_SCALE_X = 1;
let COORD_SCALE_Y = 1;
let selectedIndex = -1;
let zoom = 1;
const hiddenSet = new Set();
let sideWidth = parseInt(localStorage.getItem('ak_viewer_side') || '360', 10) || 360;
const INITIAL_QUERY = QS.get('q') || '';
const INITIAL_SELECT = parseInt(QS.get('select') || '-1', 10);

function isHidden(node) {
  let cur = node;
  while (cur) {
    if (hiddenSet.has(cur.index)) return true;
    cur = cur.parent >= 0 ? NODES[cur.parent] : null;
  }
  return false;
}

function isBackground(node) {
  if (!node) return false;
  if (node.isWindow) return true;
  if (!TREE_W || !TREE_H) return false;
  return node.bounds.w * node.bounds.h >= TREE_W * TREE_H * 0.9;
}

function applySplit() {
  sideWidth = Math.min(Math.max(240, sideWidth), Math.max(320, window.innerWidth - 320));
  $('.workspace').style.gridTemplateColumns = `minmax(0,1fr) 6px ${sideWidth}px`;
  localStorage.setItem('ak_viewer_side', String(sideWidth));
}

function initSplitter() {
  applySplit();
  const el = $('#splitter');
  let dragging = false;
  const move = e => {
    if (!dragging) return;
    const x = (e.touches ? e.touches[0].clientX : e.clientX);
    sideWidth = window.innerWidth - x;
    applySplit();
    e.preventDefault();
  };
  const stop = () => { dragging = false; el.classList.remove('drag'); document.body.style.userSelect = ''; };
  el.addEventListener('mousedown', e => { dragging = true; el.classList.add('drag'); document.body.style.userSelect = 'none'; e.preventDefault(); });
  el.addEventListener('touchstart', e => { dragging = true; el.classList.add('drag'); }, {passive:true});
  window.addEventListener('mousemove', move);
  window.addEventListener('touchmove', move, {passive:false});
  window.addEventListener('mouseup', stop);
  window.addEventListener('touchend', stop);
}

function artifactURL(path) { return '/artifact?path=' + encodeURIComponent(path); }

function resourceURL(url) {
  return url + (url.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(TOKEN);
}

async function api(path) {
  const res = await fetch(path, {headers:{'X-AK-Token':TOKEN}});
  if (!res.ok) throw new Error((await res.text()) || res.statusText);
  return res.json();
}

function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'toast show';
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = 'toast', 2500);
}

function parseBounds(value) {
  const m = String(value || '').match(/\[(\d+),(\d+)\]\[(\d+),(\d+)\]/);
  if (!m) return null;
  return {x:+m[1], y:+m[2], x2:+m[3], y2:+m[4], w:+m[3]-+m[1], h:+m[4]-+m[2]};
}

function walk(value, parent, windowInfo, depth, out) {
  if (!value || typeof value !== 'object') return;
  if (Array.isArray(value)) {
    value.forEach(v => walk(v, parent, windowInfo, depth, out));
    return;
  }
  const b = parseBounds(value.bounds);
  if (b) {
    const node = {
      index: out.length,
      raw: Object.assign({}, value),
      bounds: b,
      parent,
      window: windowInfo,
      depth,
      text: value.text || '',
      id: value['resource-id'] || '',
      desc: value['content-desc'] || '',
      cls: value.class || '',
      interactions: value.interactions || [],
      center: value.center || '',
      childrenCount: Array.isArray(value.children) ? value.children.length : 0,
      isWindow: false
    };
    out.push(node);
    parent = node.index;
  }
  if (Array.isArray(value.children)) {
    value.children.forEach(child => walk(child, parent, windowInfo, depth+1, out));
  }
  if (Array.isArray(value.content)) {
    value.content.forEach(child => walk(child, parent, windowInfo, depth+1, out));
  }
}

function buildNodes(tree) {
  const out = [];
  (tree || []).forEach((win, wi) => {
    const info = {
      title: win['window-title'] || '',
      type: win.type || '',
      layer: win.layer,
      active: !!win.active,
      focused: !!win.focused
    };
    const winBounds = parseBounds(win.bounds);
    if (winBounds) {
      out.push({index:out.length, raw:Object.assign({},win), bounds:winBounds, parent:-1,
        window:info, depth:0, text:info.title, id:'', desc:'', cls:'window',
        interactions:[], center:'', childrenCount:Array.isArray(win.content)?win.content.length:0,
        isWindow:true});
    }
    if (Array.isArray(win.content)) {
      win.content.forEach(child => walk(child, out.length-1, info, 1, out));
    }
  });
  return out;
}

async function loadViewer() {
  try {
    const state = await api('/api/artifacts' + (PROJECT_ID ? '?project=' + encodeURIComponent(PROJECT_ID) : ''));
    DISPLAY = state.display || DISPLAY;
    const self = (state.artifacts || []).find(x => x.path === UI_PATH);
    if (self && self.activity) setActivity(self.activity);
    else loadActivity();
    if (UI_PATH && SHOT_PATH) {
      const uiRes = await fetch(resourceURL(artifactURL(UI_PATH)), {headers:{'X-AK-Token':TOKEN}});
      if (!uiRes.ok) throw new Error('读取 UI JSON 失败: ' + (await uiRes.text()));
      TREE = await uiRes.json();
      NODES = buildNodes(TREE);
      $('#shot').src = resourceURL(artifactURL(SHOT_PATH));
      $('#shot-link').href = resourceURL(artifactURL(SHOT_PATH));
      $('#shot').onload = () => {
        NATIVE_W = $('#shot').naturalWidth;
        NATIVE_H = $('#shot').naturalHeight;
        calibrate();
        renderBoxes();
        if (INITIAL_SELECT >= 0) selectNode(INITIAL_SELECT);
        fitZoom();
      };
    } else if (UI_PATH) {
      const uiRes = await fetch(resourceURL(artifactURL(UI_PATH)), {headers:{'X-AK-Token':TOKEN}});
      if (!uiRes.ok) throw new Error('读取 UI JSON 失败: ' + (await uiRes.text()));
      TREE = await uiRes.json();
      NODES = buildNodes(TREE);
      NATIVE_W = Math.max(...NODES.map(n => n.bounds.x2), DISPLAY.width, 1);
      NATIVE_H = Math.max(...NODES.map(n => n.bounds.y2), DISPLAY.height, 1);
      calibrate();
      $('#shot').style.display = 'none';
      $('#canvas-hold').style.width = NATIVE_W + 'px';
      $('#canvas-hold').style.height = NATIVE_H + 'px';
      $('#shot-link').style.display = 'none';
      fitZoom();
    } else {
      const all = state.artifacts || [];
      const ui = all.find(x => x.kind === 'ui' && x.name.endsWith('.json'));
      const shot = all.find(x => x.kind === 'screenshot');
      if (!ui) throw new Error('没有找到 UI JSON，先执行 ak layout -p');
      const next = new URL(location.href);
      next.searchParams.set('ui', ui.path);
      if (shot) next.searchParams.set('shot', shot.path);
      if (PROJECT_ID) next.searchParams.set('project', PROJECT_ID);
      location.replace(next.toString());
      return;
    }
    renderBoxes();
    if (INITIAL_SELECT >= 0 && (!SHOT_PATH || $('#shot').complete)) selectNode(INITIAL_SELECT);
  } catch (e) {
    $('#match-status').textContent = '加载失败: ' + e.message;
    $('#match-status').className = 'status err';
  }
}

function setActivity(value) {
  const el = $('#head-act');
  if (!el || !value) return;
  el.textContent = value;
  el.hidden = false;
}

async function loadActivity() {
  try {
    const r = await api('/api/activity' + (PROJECT_ID ? '?project=' + encodeURIComponent(PROJECT_ID) : ''));
    if (r && r.activity) setActivity(r.activity);
  } catch (e) { /* 设备离线时静默 */ }
}

function calibrate() {
  const bounds = Array.isArray(TREE) ? TREE.map(w => parseBounds(w.bounds)).filter(Boolean) : [];
  const limitW = NATIVE_W || DISPLAY.width || 0;
  const limitH = NATIVE_H || DISPLAY.height || 0;
  const extent = (values, limit) => {
    const kept = limit ? values.filter(v => v <= limit * 1.02) : values;
    if (!kept.length) return values.length ? Math.max(...values) : 0;
    return Math.max(...kept);
  };
  TREE_W = extent(bounds.map(b => b.x2), limitW);
  TREE_H = extent(bounds.map(b => b.y2), limitH);
  if (!bounds.length || !TREE_W || !TREE_H) {
    TREE_W = Math.max(DISPLAY.width || 0, 1);
    TREE_H = Math.max(DISPLAY.height || 0, 1);
  }
  COORD_SCALE_X = NATIVE_W / TREE_W;
  COORD_SCALE_Y = NATIVE_H / TREE_H;
  if (Math.abs(COORD_SCALE_X - 1) > 0.001 || Math.abs(COORD_SCALE_Y - 1) > 0.001) {
    $('#match-status').title = `UI 坐标 ${TREE_W}×${TREE_H} → 截图 ${NATIVE_W}×${NATIVE_H}，校准 ${COORD_SCALE_X.toFixed(3)}×${COORD_SCALE_Y.toFixed(3)}`;
  }
}

function setZoom(value) {
  zoom = Math.min(2, Math.max(0.05, value));
  const w = (NATIVE_W || $('#shot').naturalWidth || 1) * zoom;
  const h = (NATIVE_H || $('#shot').naturalHeight || 1) * zoom;
  const hold = $('#canvas-hold');
  hold.style.width = w + 'px';
  hold.style.height = h + 'px';
  $('#canvas-wrap').style.transform = 'scale(' + zoom + ')';
  $('#zoom-label').textContent = Math.round(zoom*100) + '%';
}

function fitZoom() {
  const stage = $('#stage');
  const w = NATIVE_W || $('#shot').naturalWidth || 1;
  const h = NATIVE_H || $('#shot').naturalHeight || 1;
  const availW = Math.max(200, stage.clientWidth - 48);
  const availH = Math.max(200, stage.clientHeight - 48);
  setZoom(Math.min(1, availW/w, availH/h));
}

function searchable(node) {
  return [node.id, node.text, node.desc, node.cls, node.raw.class, node.raw['resource-id'], node.raw['content-desc']]
    .filter(Boolean).join('\n').toLowerCase();
}

// 只保留 :id/ 后面的名字：com.pkg:id/btn_login -> btn_login
const ID_PREFIX = /^[^:]*:(?:id\/)?/;
function shortId(v) { return String(v ?? '').replace(ID_PREFIX, ''); }

function matches(node, query) {
  if (!query) return false;
  return query.split(/\s+/).filter(Boolean).every(word => searchable(node).includes(word));
}

function renderBoxes() {
  const query = $('#search').value.trim().toLowerCase();
  const showAll = $('#show-all').checked;
  const visible = NODES.map(node => {
    if (isHidden(node)) return '';
    const isMatch = matches(node, query);
    if (query && !isMatch) return '';
    if (!query && !showAll && node.depth > 2) return '';
    const b = scaleBounds(node.bounds);
    if (b.w <= 0 || b.h <= 0) return '';
    const idTxt = shortId(node.id);
    const nameTxt = node.text || node.desc || '';
    const label = (idTxt ? `<span class="lbl-id">${esc(idTxt)}</span>` : '')
      + (nameTxt ? `<span class="lbl-name">${esc(nameTxt)}</span>` : '')
      || `<span class="lbl-name">${esc(node.cls || 'window')}</span>`;
    return {node, isMatch, b, label};
  }).filter(Boolean);
  const html = visible.sort((a, z) => {
    const area = x => x.b.w * x.b.h;
    return area(z) - area(a);
  }).map(({node, isMatch, b, label}) => {
    const bg = isBackground(node);
    const cls = [
      'box',
      bg ? 'window' : '',
      isMatch ? 'match' : '',
      node.index === selectedIndex ? 'selected' : ''
    ].filter(Boolean).join(' ');
    return `<div class="${cls}"
      style="left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px"
      data-index="${node.index}"${bg ? '' : ` onclick="selectNode(${node.index},event)"`}>
      ${bg ? '' : `<span class="label">${label}</span>`}
    </div>`;
  }).join('');
  $('#overlay').innerHTML = html;
  $('#overlay').style.width = (NATIVE_W || 1) + 'px';
  $('#overlay').style.height = (NATIVE_H || 1) + 'px';
  const count = NODES.filter(n => !isHidden(n) && matches(n, query)).length;
  const total = NODES.length - hiddenSet.size;
  const scaleTip = (Math.abs(COORD_SCALE_X - 1) > 0.001 || Math.abs(COORD_SCALE_Y - 1) > 0.001)
    ? ` · 缩放 ${COORD_SCALE_X.toFixed(3)}×${COORD_SCALE_Y.toFixed(3)}`
    : ' · 1:1';
  $('#match-status').textContent = query
    ? `匹配 ${count} / ${total} 个节点`
    : `${total} 个节点 · ${DISPLAY.dpi} dpi${scaleTip}`;
  $('#match-status').className = 'status';
}

function applyFilter() { renderBoxes(); }

if (INITIAL_QUERY) $('#search').value = INITIAL_QUERY;

function scaleBounds(bounds) {
  return {
    x: bounds.x * COORD_SCALE_X, y: bounds.y * COORD_SCALE_Y,
    x2: bounds.x2 * COORD_SCALE_X, y2: bounds.y2 * COORD_SCALE_Y,
    w: bounds.w * COORD_SCALE_X, h: bounds.h * COORD_SCALE_Y
  };
}

function selectNode(index, event) {
  if (event) event.stopPropagation();
  const picked = NODES[index];
  if (!picked || isBackground(picked)) return;
  selectedIndex = index;
  renderBoxes();
  const node = NODES[index];
  if (!node) return;
  const b = scaleBounds(node.bounds);
  const scale = DISPLAY.scale || 1;
  const px = value => Math.round(value);
  const dp = value => Math.round(value/scale);
  const rows = [
    ['resource-id', shortId(node.id)], ['text', node.text], ['content-desc', node.desc],
    ['class', node.cls], ['bounds', node.raw.bounds], ['center', node.center],
    ['左上 (px)', `${px(b.x)}, ${px(b.y)}`], ['宽高 (px)', `${px(b.w)} × ${px(b.h)}`],
    ['左上 (dp)', `${dp(b.x)}, ${dp(b.y)}`], ['宽高 (dp)', `${dp(b.w)} × ${dp(b.h)}`],
    ['window', `${node.window.title || '(untitled)'} · layer ${node.window.layer ?? '-'}`],
    ['type / depth', `${node.window.type || '-'} / ${node.depth}`],
    ['children', node.childrenCount], ['node #', node.index]
  ];
  const chips = node.interactions.map(x => `<span class="chip">${esc(x)}</span>`).join('') || '<span class="chip">无</span>';
  const raw = Object.assign({}, node.raw);
  delete raw.children;
  delete raw.content;
  delete raw.interactions;
  if (raw['resource-id']) raw['resource-id'] = shortId(raw['resource-id']);
  $('#info').innerHTML = `
    <div class="section"><button class="btn" onclick="hideSelected()" title="从当前视图隐藏该元素及其子元素">删除元素（仅隐藏）</button></div>
    <div class="section"><h3>结构化属性</h3><div class="kv">
      ${rows.map(([k,v]) => `<div class="k">${esc(k)}</div><div class="v">${esc(v || '-')}</div>`).join('')}
    </div></div>
    <div class="section"><h3>交互 / 状态</h3><div class="chips">${chips}</div></div>
    <div class="section"><h3>原始属性</h3><div class="raw">${esc(JSON.stringify(raw, null, 2))}</div></div>
    <div class="section"><h3>px → dp 换算</h3><div class="kv">
      <div class="k">dpi</div><div class="v">${DISPLAY.dpi} (${DISPLAY.source})</div>
      <div class="k">公式</div><div class="v">dp = px ÷ ${scale.toFixed(3)}</div>
      <div class="k">屏幕</div><div class="v">${DISPLAY.width || '?'} × ${DISPLAY.height || '?'} px</div>
      <div class="k">UI / 图</div><div class="v">${TREE_W}×${TREE_H} → ${NATIVE_W}×${NATIVE_H}</div>
    </div></div>`;
}

function copyBounds() {
  if (selectedIndex < 0) return toast('先选中一个元素');
  copyText(NODES[selectedIndex].raw.bounds || '');
}

function hideSelected() {
  if (selectedIndex < 0) return toast('先选中一个元素');
  hiddenSet.add(selectedIndex);
  selectedIndex = -1;
  $('#info').innerHTML = '<div class="empty">已隐藏，按 Delete 继续删除；点顶部「恢复全部」可还原</div>';
  updateHiddenBar();
  renderBoxes();
}

function restoreHidden() {
  hiddenSet.clear();
  selectedIndex = -1;
  updateHiddenBar();
  renderBoxes();
  $('#info').innerHTML = '<div class="empty">点击左侧线框或截图上的元素</div>';
}

function updateHiddenBar() {
  const n = hiddenSet.size;
  $('#hidden-count').textContent = String(n);
  $('#hiddenbar').classList.toggle('on', n > 0);
}

document.addEventListener('keydown', e => {
  const tag = (e.target && e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if ((e.key === 'Delete' || e.key === 'Backspace') && selectedIndex >= 0) {
    e.preventDefault();
    hideSelected();
  }
});

async function copyText(text) {
  let ok = false;
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); ok = true; } } catch (_) {}
  if (!ok) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;left:-9999px;opacity:0';
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch (_) {}
    ta.remove();
  }
  toast(ok ? '已复制 ' + text : '复制失败');
}

window.addEventListener('resize', () => { if (zoom < 1) fitZoom(); });

// 悬停气泡：固定字号，不随缩放变小
const tipEl = $('#tip');
function hideTip() { tipEl.hidden = true; }

function showTip(box) {
  if (!box || box.classList.contains('window')) return hideTip();
  const node = NODES[+box.dataset.index];
  if (!node) return hideTip();
  const idTxt = shortId(node.id);
  const nameTxt = node.text || node.desc || '';
  tipEl.innerHTML = (idTxt ? `<b>${esc(idTxt)}</b>` : '')
    + (nameTxt ? `<span>${esc(nameTxt)}</span>` : '')
    + (!idTxt && !nameTxt ? `<b>${esc(node.cls || 'window')}</b>` : '');
  tipEl.hidden = false;
  const r = box.getBoundingClientRect();
  const tw = tipEl.offsetWidth;
  const th = tipEl.offsetHeight;
  let left = r.left;
  if (left + tw > window.innerWidth - 8) left = Math.max(8, window.innerWidth - tw - 8);
  let top = r.top - th - 7;
  if (top < 8) top = r.bottom + 7;
  tipEl.style.left = left + 'px';
  tipEl.style.top = top + 'px';
}

$('#overlay').addEventListener('mouseover', e => {
  const box = e.target.closest?.('.box');
  if (box) showTip(box);
});
$('#overlay').addEventListener('mouseout', e => {
  const box = e.target.closest?.('.box');
  if (box) hideTip();
});
['scroll', 'wheel'].forEach(evt => $('#stage').addEventListener(evt, hideTip, {passive: true}));

initSplitter();
loadViewer();
</script>
</body>
</html>
